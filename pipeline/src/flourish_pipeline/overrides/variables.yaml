  # ------------------------------------------------------- Demographics
  AGE:
    display_name: Age
    family: demographics
    scale_type: count
    min: 18
    max: 99
    notes: >-
      99 is a valid top-code (99+, 28 respondents) and 98 is a real age
      (4 respondents); the sentinels are -998/998/999, NOT the usual
      -98/98/99. Adults only, so min is 18.
  GENDER:
    display_name: Gender
    family: demographics
    scale_type: nominal
    notes: >-
      No wave suffix. 3 = Other and 4 = Prefer not to answer are
      substantive codes; 98/99 are DK/Refused.
  EDUCATION_3:
    display_name: Education (three levels)
    family: demographics
    notes: "Refused is printed as (RF) here, not (Refused)."
