# Hand-curated metadata for every global-file variable (169 base names),
# generated as a draft from the parsed codebook and then reviewed by hand
# against each entry's value labels (ADR-0004). Precedence:
# overrides > CSV header > PDF.
#
# Defaults (omitted keys): direction: none, review_status: reviewed,
# scale_type inferred from the value labels, min/max inferred.
#
# direction says which end of the CODED scale is the better outcome, read
# from the labelled endpoints, not from the variable name:
#   - LONELY is coded 0 = Always … 10 = Never, so HIGHER is better as coded.
#   - EXPENSES / WORRY_SAFETY are coded 0 = Worry all of the time …
#     10 = Do not ever worry, so HIGHER is better as coded.
#   - The PHQ-2/GAD-2 items are coded 1 = Nearly every day … 4 = Not at
#     all — the reverse of the usual PHQ direction — so HIGHER (fewer
#     symptoms) is better as coded; the derive stage scores them 4 − code.
#   - "none" marks behaviours and attitudes with no defensible
#     better/worse end (religious attendance, political approval, …).
#
# scale_type overrides mark consecutive 1..k codes that are NOT ordered
# ("Agree / Disagree / Not relevant / Unsure" and similar), which the
# inference would otherwise call ordinal.

aliases:
  # Codebook heading -> CSV base name, where mechanical suffix stripping
  # does not already match.
  ANNUAL_WEIGHT_1: ANNUAL_WEIGHT_C1

heading_fixes:
  # The codebook prints DOI_ANNUAL_Y2 twice; the second occurrence (label
  # "End Date of Interview – Midyear Survey") is really DOI_MY.
  - heading: DOI_ANNUAL_Y2
    when_label_contains: Midyear
    use: DOI_MY

allow_unmatched_headings: []
allow_undocumented_columns: []

