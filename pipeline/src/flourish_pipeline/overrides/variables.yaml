    family: demographics
    special_codes:
      9900: valid
    notes: >-
      Country-specific bands (country × 100 + band); band counts differ by
      country. Bands changed between Y1 and Y2 in Argentina and Türkiye
      (inflation) and Egypt used finer brackets at Y2, so value labels are
      per wave; the Y2 entry lists only those three countries and Türkiye's
      Y2 bands skip 1914/1915. 9900 = (None/No household income) is an
      ANSWER, not a non-response, despite the parentheses.
