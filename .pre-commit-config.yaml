repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      # Raw GFS CSVs are 138 MB; this is one line of defence against committing them.
      - id: check-added-large-files
        args: [--maxkb=1000]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # The other line of defence: no data files, whatever their size.
      - id: forbid-data-files
        name: block data files (csv/parquet/duckdb, data/)
        entry: >-
          Data files must never be committed (data-use terms; see
          data/README.md). Only data/README.md, data/manifest.json and
          data/validation_report.md (aggregates only) are allowed.
        language: fail
        files: (?i)(\.(csv|parquet|duckdb)$|^data/)
        exclude: ^data/(README\.md|manifest\.json|validation_report\.md)$
      - id: prettier
        name: prettier (apps/web)
        entry: bash -c 'cd apps/web && pnpm exec prettier --write --log-level warn .'
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: eslint
        name: eslint (apps/web)
        entry: bash -c 'cd apps/web && pnpm exec eslint .'
        language: system
        files: ^apps/web/.*\.(ts|tsx|js)$
        pass_filenames: false
