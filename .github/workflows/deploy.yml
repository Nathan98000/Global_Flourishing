name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Deploys activate once the secrets/variables from docs/SETUP.md exist;
  # until then this workflow succeeds by skipping the deploy jobs.
  # Secrets are not readable from job-level `if`, so surface their presence here.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has-gcp: ${{ steps.check.outputs.has-gcp }}
      has-cloudflare: ${{ steps.check.outputs.has-cloudflare }}
    steps:
      - id: check
        run: |
          echo "has-gcp=${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' }}" >> "$GITHUB_OUTPUT"
          echo "has-cloudflare=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          if [ "${{ steps.check.outputs.has-gcp }}" != "true" ]; then
            echo "::notice::API deploy skipped — set the GCP secrets/variables from docs/SETUP.md"
          fi
          if [ "${{ steps.check.outputs.has-cloudflare }}" != "true" ]; then
            echo "::notice::Web deploy skipped — set the Cloudflare secrets from docs/SETUP.md"
          fi

  deploy-api:
    name: API → Cloud Run
    needs: preflight
    if: needs.preflight.outputs.has-gcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/flourish/api"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -f infra/Dockerfile --build-arg GIT_SHA=${{ github.sha }} \
            -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:${{ github.sha }}" .
          docker push --all-tags "$IMAGE"
          echo "IMAGE=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE || 'flourish-atlas-api' }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated --port=8080 --memory=512Mi --cpu=1
            --min-instances=0 --max-instances=2
          env_vars: |
            FA_ENV=prod
            FA_GIT_SHA=${{ github.sha }}
            FA_CORS_ORIGINS=${{ vars.WEB_ORIGIN }}
      - name: Smoke test deployed /health
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "Service URL: $url"
          # Note: Cloud Run's front end intercepts the exact path /healthz on
          # *.run.app and returns its own 404, so the probe must be /health.
          for i in $(seq 1 10); do
            if body=$(curl -fsS "$url/health"); then
              echo "$body"
              exit 0
            fi
            echo "attempt $i/10 failed; retrying in 6s"
            sleep 6
          done
          echo "::error::/health did not respond OK after 10 attempts"
          exit 1

  deploy-web:
    name: Web → Cloudflare Pages
    needs: preflight
    if: needs.preflight.outputs.has-cloudflare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/web build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main: the workflow runs on a tag checkout, which has no
          # branch name, so without it Cloudflare files the upload as a
          # preview deployment and the production host stays empty.
          command: pages deploy apps/web/dist --project-name=${{ vars.CF_PAGES_PROJECT || 'flourish-atlas' }} --branch=main
