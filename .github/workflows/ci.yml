name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --frozen --all-packages
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (with coverage)
        run: uv run pytest --cov=flourish_api --cov=flourish_pipeline --cov=flourish_stats --cov-report=term-missing
      - name: Coverage gate (stats/src ≥ 90%)
        run: uv run coverage report --include='stats/src/*' --fail-under=90
      - name: Coverage gate (services/api/src ≥ 90%)
        run: uv run coverage report --include='services/api/src/*' --fail-under=90
      - name: OpenAPI schema in sync (regenerate with `uv run python -m flourish_api.openapi > apps/web/openapi.json`)
        run: uv run python -m flourish_api.openapi | diff -u apps/web/openapi.json -

  web:
    name: Web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile
      - name: Synthetic fixture tier (vitest reads apps/web/public/data)
        run: make web-fixtures
      - name: ESLint + Prettier
        run: pnpm -C apps/web lint
      - name: Typecheck
        run: pnpm -C apps/web typecheck
      - name: Vitest
        run: pnpm -C apps/web test
      - name: TS client in sync (regenerate with `pnpm -C apps/web gen:api`)
        run: |
          pnpm -C apps/web gen:api
          git diff --exit-code apps/web/src/api/schema.d.ts
      - name: Build
        run: pnpm -C apps/web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile
      - name: Synthetic fixture tier
        run: make web-fixtures
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: Six journeys (incl. API blocked → static-first)
        run: pnpm -C apps/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse + bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile
      - name: Synthetic fixture tier
        run: make web-fixtures
      - name: Build
        run: pnpm -C apps/web build
      - name: Bundle budget (initial route ≤ 250 kB gzipped)
        run: pnpm -C apps/web budget
      - name: Synthetic API (audit the healthy state, not the outage banner)
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'services/api/tests')
          from pathlib import Path
          from synthetic_db import build_synthetic_db
          build_synthetic_db(Path('/tmp/lh-db'))"
          FA_DATA_PATH=/tmp/lh-db/flourish.duckdb nohup uv run uvicorn flourish_api.main:app --port 8080 > /tmp/lh-api.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS localhost:8080/health
      - name: Lighthouse (performance ≥ 90, accessibility ≥ 95)
        run: pnpm -C apps/web exec lhci autorun
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lhci-report
          path: apps/web/lhci-report
          retention-days: 7

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f infra/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t flourish-api .
      - name: Smoke test /health
        run: |
          docker run -d -p 8080:8080 --name api flourish-api
          ok=0
          for i in $(seq 1 20); do
            if body=$(curl -fsS localhost:8080/health); then ok=1; break; fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs api || true
          docker rm -f api
          test "$ok" = 1
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"git_sha":"${{ github.sha }}"'

  pre-commit:
    name: pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          uv sync --frozen --all-packages
          pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
