[project]
name = "flourish-api"
version = "0.1.0"
description = "Flourish Atlas API — FastAPI over DuckDB aggregates of the Global Flourishing Study"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "flourish-stats",
]

[tool.uv.sources]
flourish-stats = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flourish_api"]
