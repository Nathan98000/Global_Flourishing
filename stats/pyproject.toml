[project]
name = "flourish-stats"
version = "0.1.0"
description = "Flourish Atlas statistics engine — survey-weighted estimators with design-based CIs"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.5.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flourish_stats"]
