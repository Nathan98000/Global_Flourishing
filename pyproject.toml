[project]
name = "flourish-atlas"
version = "0.1.0"
description = "Flourish Atlas monorepo root — interactive explorer for the Global Flourishing Study"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-cov>=6",
    "httpx>=0.27",
    "hypothesis>=6.115",
    "pyarrow-stubs>=20",
    "pre-commit>=4",
    "nbstripout>=0.9.1",
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "pipeline", "stats"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The GFS codebook itself uses en dashes and × in its text; the pipeline
# quotes it verbatim in strings, docstrings and comments.
"pipeline/**" = ["RUF001", "RUF002", "RUF003"]
# The stats docstrings and comments write estimator maths (−, ȳ, Σ, ×)
# exactly as METHODS.md and the survey literature do.
"stats/**" = ["RUF001", "RUF002", "RUF003"]
# The API's served descriptions (OpenAPI, derived-outcome labels) quote
# scale text ("0–10") the way the codebook and METHODS.md write it.
"services/api/**" = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["services/api", "pipeline", "stats"]
exclude = ["**/__pycache__", "**/.venv", "data"]
strict = ["services/api/src", "pipeline/src", "stats/src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "pipeline/tests", "stats/tests", "stats/verify"]
addopts = "-q"
