<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flourish Atlas</title>
    <meta
      name="description"
      content="Explore the Global Flourishing Study: wellbeing across 23 countries, 2023-2024."
    />
    <script>
      // Apply the persisted theme before first paint (see src/theme.ts).
      try {
        var t = localStorage.getItem('flourish-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
