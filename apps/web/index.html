<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flourish Atlas</title>
    <meta
      name="description"
      content="Explore the Global Flourishing Study: wellbeing across 23 countries, 2023-2024."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The heading weight paints first (display: swap covers the 400). -->
    <link
      rel="preload"
      href="/fonts/source-serif-4-latin-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Boot data races the JS parse instead of waiting behind it: the
         static tier's catalog files plus the default Atlas view.
         `crossorigin` matches fetch()'s own request (CORS mode, same-origin
         credentials): without it Chrome drops each preload and downloads
         the file again (H7). -->
    <link rel="preload" href="/data/meta.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/variables.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/sfi/Y1/mean_by-country_code.json" as="fetch" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flourish Atlas" />
    <meta
      property="og:description"
      content="Survey-weighted wellbeing across 23 countries — every number with its confidence interval and sample size. Global Flourishing Study, 2023-2024."
    />
    <meta property="og:url" content="https://flourish-atlas.pages.dev/" />
    <meta property="og:image" content="https://flourish-atlas.pages.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flourish Atlas" />
    <meta
      name="twitter:description"
      content="Survey-weighted wellbeing across 23 countries, with confidence intervals on every number."
    />
    <meta name="twitter:image" content="https://flourish-atlas.pages.dev/og.png" />
    <meta name="color-scheme" content="light" />
    <!-- The boot shell's look (H7): the wordmark, the nav and the page's
         shape, as AppShell.module.css and PagePlaceholder.module.css draw
         them, so the app takes their place without moving them. -->
    <style>
      .boot {
        max-width: 60rem;
        margin: 0 auto;
        padding: clamp(16px, 4vw, 32px);
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
        min-height: 100dvh;
      }
      .boot-header {
        display: flex;
        align-items: center;
        gap: var(--space-4) var(--space-5);
        flex-wrap: wrap;
      }
      .boot-brand {
        margin: 0;
        font-family: var(--font-serif);
        font-size: var(--text-brand);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .boot-brand a {
        color: inherit;
        text-decoration: none;
      }
      .boot-nav {
        display: flex;
        gap: 24px;
        margin-right: auto;
      }
      .boot-nav a {
        color: var(--ink-secondary);
        font-size: var(--text-sm);
        letter-spacing: 0.02em;
        text-decoration: none;
        white-space: nowrap;
      }
      .boot-gap {
        display: none;
      }
      .boot-ghost {
        display: block;
        border-radius: 3px;
        background: var(--grid);
      }
      .boot-deck {
        display: grid;
        gap: 13px;
        max-width: 34rem;
        padding: 8px 0 6px;
        margin: 0 0 var(--space-5);
      }
      .boot-deck > .boot-ghost {
        height: 14px;
      }
      .boot-deck > .boot-ghost + .boot-ghost {
        width: 70%;
      }
      .boot-field {
        width: min(26rem, 100%);
        height: 66px;
        margin: 0 0 var(--space-5);
        opacity: 0.6;
      }
      .boot-narrow {
        display: none;
      }
      .boot-caption {
        display: grid;
        gap: 10px;
        padding: 25px 0 var(--space-4);
        border-top: 1px solid var(--grid);
      }
      @media (max-width: 50rem) {
        .boot-header {
          row-gap: 0;
        }
        .boot-nav {
          flex-basis: 100%;
          order: 3;
          flex-wrap: wrap;
          gap: 0;
          border-bottom: 1px solid var(--grid);
        }
        .boot-nav a {
          padding: var(--space-2) var(--space-1) var(--space-3);
          min-height: 44px;
          display: inline-flex;
          align-items: center;
        }
        .boot-nav > a {
          margin-right: 2px;
        }
        .boot-gap {
          display: block;
          flex: 1 1 0;
          max-width: calc(var(--space-3) - 2px);
        }
      }
      @media (max-width: 40rem) {
        .boot {
          gap: var(--space-4);
        }
        .boot-nav .boot-later {
          display: none;
        }
        .boot-deck {
          gap: 10px;
          margin-bottom: var(--space-3);
        }
        .boot-field {
          margin-bottom: var(--space-3);
        }
        .boot-narrow {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <!-- Painted before the script runs (H7): the app replaces it. -->
    <div id="root">
      <div class="boot">
        <header class="boot-header">
          <h1 class="boot-brand"><a href="/">Flourish Atlas</a></h1>
          <nav class="boot-nav" aria-label="Main">
            <a href="/">Atlas</a><span class="boot-gap"></span> <a href="/change">Change</a
            ><span class="boot-gap"></span> <a href="/what-matters">What Matters</a
            ><span class="boot-gap"></span> <a href="/correlates">Correlates</a
            ><span class="boot-gap"></span> <a class="boot-later" href="/states">US States</a
            ><span class="boot-gap boot-later"></span>
            <a class="boot-later" href="/segments">Segments</a
            ><span class="boot-gap boot-later"></span>
            <a class="boot-later" href="/methods">Methods</a>
          </nav>
        </header>
        <main aria-busy="true">
          <div class="boot-deck">
            <span class="boot-ghost"></span><span class="boot-ghost"></span>
          </div>
          <span class="boot-ghost boot-field"></span>
          <span class="boot-ghost boot-field boot-narrow"></span>
          <div class="boot-caption">
            <span class="boot-ghost" style="width: min(22rem, 70%); height: 24px"></span>
            <span class="boot-ghost" style="width: min(18rem, 55%); height: 12px"></span>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
